[package]
name = "ci"
version = "0.1.0"
edition = "2021"
description = "CI orchestrator: replaces the shell-script pipeline-gen with a Rust binary"

[[bin]]
name = "ci-orchestrator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
