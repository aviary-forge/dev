# This file defines the static Buildkite pipeline.
#
# Pipeline flow:
# 1. build-tools: compile ci-orchestrator and other CI tools
# 2. pipeline-gen: discover targets, diff against trunk, upload dynamic steps
#    (one build step per system + one ci-post-build step)
# 3. wait: let all dynamic steps (build + post-build) complete
---
steps:
  - label: ":hammer_and_wrench:"
    key: "build-tools"
    priority: 1
    command: "nix-build -A pipelines.tasks.tools"

  # Generate & upload dynamic build steps via the Rust orchestrator.
  # The dynamic pipeline contains:
  #   - one build step per system (ci-orchestrator build)
  #   - one post-build step (ci-orchestrator post-build)
  - label: ":thinking_face:"
    depends_on:
      - "build-tools"
    key: "pipeline-gen"
    priority: 1
    command: |
      "$(nix-build -A pipelines.tasks.pre-build)/bin/pre-build-pipeline-step"

  # Wait for all dynamic steps to complete (build + post-build).
  - wait: null
    continue_on_failure: true
