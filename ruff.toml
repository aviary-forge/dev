# Baseline ruff config for the monorepo Python tooling.
#
# ruff.toml (not pyproject.toml) because buildPythonProject passes it to
# in-build ruff via --config, which needs a pure ruff config file. Projects
# can override via their own pyproject.toml [tool.ruff].

line-length = 100
target-version = "py312"

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]

[lint.isort]
# One line per workspace member's module name. ruff resolves isort's
# first-party src paths relative to the config file's directory, so the
# explicit list is what keeps dev and build classification identical
# (and makes --config safe in buildPythonProject).
known-first-party = ["mono_switch", "pi_extensions_update"]

[format]
quote-style = "double"
indent-style = "space"
