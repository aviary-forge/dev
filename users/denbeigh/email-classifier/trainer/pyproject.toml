[project]
name = "email-trainer"
version = "0.1.0"
description = "Model training pipeline"
readme = "README.md"
authors = [
  { name = "Denbeigh Stevens", email = "denbeigh@denbeighstevens.com" },
]
requires-python = ">=3.14"
dependencies = [
  "sentence-transformers>=3.4.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.6.0",
  "html2text>=2024.2.0",
  "transformers>=4.46.0,<5.0.0",
  "setfit>=1.0.0,<1.1.4",
  "onnx>=1.17.0",
  "onnxruntime>=1.20.0",
  "skl2onnx>=1.18.0",
  "onnxconverter-common>=1.10.0",
]

[project.scripts]
email-trainer = "email_trainer:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
